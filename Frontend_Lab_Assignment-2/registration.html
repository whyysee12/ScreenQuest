<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 30px;
}
form {
  width: 350px;
  margin: auto;
  border: 1px solid black;
  padding: 20px;
}
label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}
input, select {
  width: 100%;
  padding: 5px;
  margin-top: 4px;
}
input[type="submit"] {
  margin-top: 20px;
  width: auto;
  padding: 8px 20px;
}
</style>
</head>
<body>

<h2 style="text-align:center;">Registration Form</h2>

<form action="#" method="post">

  <label for="fname">Full Name:</label>
  <input type="text" id="fname" name="fname" required>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>

  <label for="pass">Password:</label>
  <input type="password" id="pass" name="pass" required>

  <label>Gender:</label>
  <input type="radio" id="male" name="gender" value="male">
  <label for="male" style="display:inline; font-weight:normal;">Male</label>
  <input type="radio" id="female" name="gender" value="female">
  <label for="female" style="display:inline; font-weight:normal;">Female</label>

  <label>Hobbies:</label>
  <input type="checkbox" id="reading" name="hobbies" value="reading">
  <label for="reading" style="display:inline; font-weight:normal;">Reading</label>
  <input type="checkbox" id="sports" name="hobbies" value="sports">
  <label for="sports" style="display:inline; font-weight:normal;">Sports</label>
  <input type="checkbox" id="music" name="hobbies" value="music">
  <label for="music" style="display:inline; font-weight:normal;">Music</label>

  <label for="course">Course:</label>
  <select id="course" name="course">
    <option value="bca">BCA</option>
    <option value="bba">BBA</option>
    <option value="btech">B.Tech</option>
    <option value="bcom">B.Com</option>
  </select>

  <input type="submit" value="Register">

</form>

</body>
</html>
